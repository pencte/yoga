<!DOCTYPE html>
<html>
<head>
    <title>Terima Kasih - TeNIME Premium</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 400px;
            padding: 40px 20px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        p {
            margin-bottom: 20px;
            opacity: 0.9;
            line-height: 1.6;
        }

        .loader {
            border: 5px solid rgba(255,255,255,0.3);
            border-top: 5px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        .checkmark {
            font-size: 80px;
            margin-bottom: 20px;
            animation: scaleIn 0.5s ease;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes scaleIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }
    </style>
    <script>
        // Ambil parameter dari URL
        const urlParams = new URLSearchParams(window.location.search);
        const amount = urlParams.get('amount');
        const message = urlParams.get('message');
        
        console.log('Payment success:', { amount, message });
        
        // Simpan data transaksi ke localStorage
        localStorage.setItem('premiumPayment', JSON.stringify({
            amount: amount,
            message: message,
            timestamp: Date.now()
        }));
        
        // Ekstrak username dari message
        let username = '';
        if (message) {
            const match = message.match(/Username: (\w+)/i);
            username = match ? match[1] : '';
        }
        
        // Tentukan paket dari amount
        let plan = '';
        if (amount == 15000) plan = 'Mingguan';
        else if (amount == 45000) plan = 'Bulanan';
        else if (amount == 120000) plan = '3 Bulan';
        else if (amount == 350000) plan = 'Tahunan';
        
        // Redirect ke aplikasi dengan parameter sukses
        setTimeout(() => {
            window.location.href = `/?premium=success&username=${username}&plan=${plan}`;
        }, 3000);
    </script>
</head>
<body>
    <div class="container">
        <div class="checkmark">✅</div>
        <h1>🎉 Terima Kasih!</h1>
        <p>Pembayaran premium Anda sedang diproses...</p>
        <div class="loader"></div>
        <p>Anda akan dialihkan otomatis ke aplikasi dalam 3 detik</p>
        <p style="font-size: 12px; margin-top: 20px;">Jangan tutup halaman ini</p>
    </div>
</body>
</html>
